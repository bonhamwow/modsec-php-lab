# Enable ModSecurity Engine and Allow Request Body Access
SecRuleEngine On
SecRequestBodyAccess On

# Custom Rule 1: Block Multipart Content-Type
SecRule REQUEST_HEADERS:Content-Type "@rx ^multipart/form-data," \
    "id:100100,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Blocked malformed multipart Content-Type header'"

# Custom Rule 2: Block PHP Session Upload
SecRule ARGS_NAMES "@streq php_session_upload_progress" \
    "id:100102,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Blocked php_session_upload_progress parameter'"